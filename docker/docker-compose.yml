version: "3.8"

services:
  # --- MariaDB Database ---
  database:
    image: mariadb:latest
    container_name: xstream-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: xstream_codes
      MYSQL_USER: xtreamcodes
      MYSQL_PASSWORD: xtream123
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Nginx Web Server (with RTMP for streaming) ---
  nginx:
    image: nginx:alpine
    container_name: xstream-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "1935:1935"  # RTMP port
    volumes:
      - ./panel:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      database:
        condition: service_healthy

  # --- PHP-FPM for Admin Panel ---
  php-fpm:
    image: php:8.2-fpm-alpine
    container_name: xstream-php-fpm
    restart: unless-stopped
    volumes:
      - ./panel:/var/www/html:ro
      - ./nginx/php.ini:/usr/local/etc/php/php.ini:ro
    environment:
      - PHP_ERRORS_LOGGING=stderr
    depends_on:
      database:
        condition: service_healthy

  # --- API Backend (FastAPI) ---
  api:
    build: ./backend
    container_name: xstream-api
    restart: unless-stopped
    environment:
      - DATABASE_HOST=database
      - DATABASE_PORT=3306
      - DATABASE_USER=xtreamcodes
      - DATABASE_PASSWORD=xtream123
      - DATABASE_NAME=xstream_codes
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy

  # --- Admin Panel (React/Vue) Optional ---
  # frontend:
  #   build: ./frontend
  #   container_name: xstream-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - api
  #     - nginx

volumes:
  db_data: